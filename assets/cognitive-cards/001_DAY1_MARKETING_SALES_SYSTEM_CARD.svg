<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1400" viewBox="0 0 1120 1400">
  <rect width="1120" height="1400" fill="#ffffff"/>
  <rect x="20" y="20" width="1080" height="1360" fill="none" stroke="#111111" stroke-width="2"/>
  <style>
    .serif{font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;fill:#111}
    .sans{font-family:Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111}
    .muted{fill:#666}
    .small{font-size:20px;letter-spacing:4px}
    .title{font-size:64px;font-weight:700}
    .sub{font-size:24px}
    .num{font-size:54px;fill:#777}
    .h2{font-size:34px;font-weight:700}
    .body{font-size:24px}
    .body2{font-size:22px}
    .tiny{font-size:18px}
  </style>

  <text x="55" y="70" class="serif small">FOUNDER STRATEGY NOTE</text>
  <text x="1065" y="70" class="serif tiny muted" text-anchor="end">CLEARER THINKING · BIGGER IMPACT</text>

  <text x="560" y="165" class="serif title" text-anchor="middle">DAY1 营销系统认知卡</text>
  <text x="560" y="215" class="sans sub" text-anchor="middle">纠正概念混淆｜营销不是空军，营销是整套作战系统</text>

  <rect x="50" y="260" width="1020" height="160" fill="none" stroke="#111"/>
  <text x="80" y="325" class="serif num">01</text>
  <text x="180" y="320" class="serif h2">商业战略｜总指挥</text>
  <text x="80" y="375" class="sans body">决定：做谁的生意、创造什么价值、如何赚钱</text>
  <text x="930" y="315" class="sans body2" text-anchor="middle">定方向</text>
  <text x="930" y="350" class="sans body2" text-anchor="middle">看全局</text>
  <text x="930" y="385" class="sans body2" text-anchor="middle">做取舍</text>

  <rect x="50" y="445" width="1020" height="190" fill="none" stroke="#111"/>
  <text x="80" y="510" class="serif num">02</text>
  <text x="180" y="505" class="serif h2">营销系统｜整套作战系统</text>
  <text x="80" y="555" class="sans body2">客户选择 ｜ 定位 ｜ 产品 ｜ 定价</text>
  <text x="80" y="595" class="sans body2">品牌 ｜ 内容 ｜ 渠道 ｜ CRM ｜ 销售协同</text>
  <circle cx="900" cy="540" r="62" fill="none" stroke="#111"/>
  <circle cx="900" cy="540" r="40" fill="none" stroke="#777"/>
  <circle cx="900" cy="540" r="18" fill="#111"/>
  <line x1="838" y1="540" x2="962" y2="540" stroke="#999"/>
  <line x1="900" y1="478" x2="900" y2="602" stroke="#999"/>

  <rect x="50" y="660" width="320" height="300" fill="#fafafa" stroke="#111"/>
  <text x="80" y="720" class="serif num">03</text>
  <text x="80" y="765" class="serif h2">品牌 / 内容 / 视频号</text>
  <text x="80" y="805" class="sans sub">空军 / 远程火力</text>
  <text x="80" y="855" class="sans body2">扩大触达</text>
  <text x="80" y="890" class="sans body2">建立认知</text>
  <text x="80" y="925" class="sans body2">形成偏好与信任</text>

  <rect x="400" y="660" width="320" height="300" fill="#fafafa" stroke="#111"/>
  <text x="430" y="720" class="serif num">04</text>
  <text x="430" y="765" class="serif h2">销售｜地面部队</text>
  <text x="430" y="815" class="sans body2">需求确认</text>
  <text x="430" y="850" class="sans body2">方案匹配</text>
  <text x="430" y="885" class="sans body2">异议处理</text>
  <text x="430" y="920" class="sans body2">报价 / 成交</text>

  <rect x="750" y="660" width="320" height="300" fill="#fafafa" stroke="#111"/>
  <text x="780" y="720" class="serif num">05</text>
  <text x="780" y="765" class="serif h2">交付｜守住阵地</text>
  <text x="780" y="815" class="sans body2">兑现价值</text>
  <text x="780" y="850" class="sans body2">形成口碑</text>
  <text x="780" y="885" class="sans body2">复购</text>
  <text x="780" y="920" class="sans body2">转介绍</text>

  <rect x="50" y="985" width="1020" height="145" fill="#111"/>
  <text x="80" y="1035" class="serif h2" fill="#fff" style="fill:#fff">经营闭环</text>
  <text x="80" y="1090" class="sans body2" fill="#fff" style="fill:#fff">注意力 → 认知 → 品牌心智 → 信任 → 有效商机 → 销售确认 → 交付 → 口碑 → 再传播</text>

  <rect x="50" y="1155" width="1020" height="100" fill="none" stroke="#111"/>
  <text x="80" y="1215" class="serif h2">真北指标</text>
  <text x="300" y="1215" class="sans body">视频号来源的有效商机价值</text>

  <rect x="50" y="1280" width="1020" height="70" fill="#fafafa" stroke="#111"/>
  <text x="80" y="1325" class="serif h2">一句话</text>
  <text x="240" y="1325" class="sans body2">好的品牌和内容，应该让销售从“说服”变成“确认”。</text>
</svg>