<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F6F3">
<title>DAY1 · Mobile Workbench</title>
<style>
:root{--bg:#F8F6F3;--paper:#FCFBF8;--ink:#222;--muted:#8B867E;--line:#DDD7CD;--red:#C6402F;--soft:#F0EBE3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",Arial,sans-serif}
.wrap{max-width:560px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:30px;letter-spacing:-1px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);vertical-align:top;margin:2px 0 0 2px}
.sub{font-size:10px;letter-spacing:.18em;color:var(--muted);margin-top:8px}.hero{margin:44px 0 22px}.hero h1{font-size:30px;font-weight:500;margin:0 0 10px}.hero p{font-size:13px;color:var(--muted);line-height:1.7}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.card h2{font-size:14px;margin:0 0 14px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;font:inherit;color:var(--ink);outline:none}textarea{min-height:132px;resize:vertical;font-size:17px;line-height:1.6}
label{display:block;font-size:11px;color:var(--muted);margin:12px 0 6px}.btn{width:100%;border:0;border-radius:12px;background:var(--ink);color:#fff;padding:14px 16px;font-size:14px;margin-top:14px}.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.status{font-size:11px;color:var(--muted);margin-top:10px}.hidden{display:none}.result{border-left:3px solid var(--red);padding-left:12px;margin-top:16px}.result b{font-size:14px}.result p{font-size:11px;color:var(--muted);line-height:1.65}
.bars{display:grid;gap:8px;margin-top:14px}.bar{display:grid;grid-template-columns:92px 1fr 40px;gap:8px;align-items:center;font-size:10px;color:var(--muted)}.track{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:start}.logout{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 11px;font-size:10px;color:var(--muted)}
.note{font-size:10px;color:var(--muted);line-height:1.6;margin-top:12px}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><div class="brand">day1<span class="dot"></span></div><div class="sub">DAY1 · 元点</div></div><div style="display:flex;gap:8px"><button id="accountBtn" class="logout hidden">账户</button><button id="logout" class="logout hidden">退出</button></div></div>

<section id="login">
  <div class="hero"><h1>手机工作台</h1><p>登录后进入 DAY1。未登录时不会加载你的工作台内容，也不能调用 Jev。</p></div>
  <div class="card">
    <h2>进入 DAY1</h2>
    <button id="googleLoginBtn" class="btn">使用 Google 登录</button>
    <div class="note">使用 day1garden58@gmail.com 登录。Google 身份会关联到原来的 DAY1 账号。</div>

    <button id="togglePassword" class="btn ghost" type="button">使用密码登录（备用）</button>
    <div id="passwordBox" class="hidden">
      <label>邮箱</label>
      <input id="email" type="email" value="day1garden58@gmail.com" autocomplete="username">
      <label>密码</label>
      <input id="password" type="password" autocomplete="current-password">
      <button id="loginBtn" class="btn">使用密码进入</button>
    </div>

    <div id="loginMsg" class="status"></div>
  </div>
</section>

<section id="app" class="hidden">
  <div class="hero"><h1>大一，你现在想做什么？</h1><p>直接说。需要做取舍时，DAY1 会把问题整理成决策结构，再交给 Jev。</p></div>
  <div class="card">
    <textarea id="prompt" placeholder="比如：我现在应该继续完善自动化，还是先集中精力获客？"></textarea>
    <button id="askBtn" class="btn">交给 DAY1</button>
    <div id="jevStatus" class="status">Jev · 检查中</div>
    <div id="result"></div>
  </div>
  <div class="note">Jev 只提供概率与置信度，不替你做最终决定。TypeSafe API Key 不会出现在手机端。</div>
</section>

<section id="accountCard" class="hidden">
  <div class="card">
    <h2>账户设置</h2>
    <label>新密码</label>
    <input id="newPassword" type="password" autocomplete="new-password" placeholder="至少 8 位">
    <label>确认新密码</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入">
    <button id="setPasswordBtn" class="btn">设置新密码</button>
    <button id="closeAccountBtn" class="btn ghost" type="button">返回工作台</button>
    <div id="passwordMsg" class="status"></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://fhvhnibznphatfnbvvnb.supabase.co';
const PUBLIC_KEY='sb_publishable_8_ElUXtWKbEM9Of37zdYug_mdWjcV4B';
const DECISION_URL='https://fhvhnibznphatfnbvvnb.supabase.co/functions/v1/workbench-decision-api';
const ROUTER_URL='https://fhvhnibznphatfnbvvnb.supabase.co/functions/v1/workbench-router-api';
const KEY='day1_mobile_session_v1';
const q=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function save(x){x?localStorage.setItem(KEY,JSON.stringify(x)):localStorage.removeItem(KEY)}
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function showApp(session){q('#login').classList.add('hidden');q('#app').classList.remove('hidden');q('#logout').classList.remove('hidden');q('#accountBtn').classList.remove('hidden');checkStatus(session)}
function showLogin(){q('#app').classList.add('hidden');q('#login').classList.remove('hidden');q('#logout').classList.add('hidden');q('#accountBtn').classList.add('hidden');q('#accountCard')?.remove()}
async function googleLogin(){
 q('#googleLoginBtn').disabled=true;q('#loginMsg').textContent='正在打开 Google 登录…';
 try{
  const redirectTo=window.location.origin+window.location.pathname;
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo}});
  if(error)throw error;
 }catch(e){
  q('#loginMsg').textContent=e.message||'Google 登录没有完成。';
  q('#googleLoginBtn').disabled=false;
 }
}

async function setNewPassword(){
 const p=q('#newPassword').value;
 const c=q('#confirmPassword').value;
 q('#passwordMsg').textContent='';
 if(p.length<8){q('#passwordMsg').textContent='密码至少 8 位。';return}
 if(p!==c){q('#passwordMsg').textContent='两次输入的密码不一致。';return}
 q('#setPasswordBtn').disabled=true;q('#passwordMsg').textContent='正在设置新密码…';
 try{
  const {error}=await sb.auth.updateUser({password:p});
  if(error)throw error;
  q('#newPassword').value='';q('#confirmPassword').value='';
  q('#passwordMsg').textContent='新密码已设置成功，正在返回工作台…';
  setTimeout(()=>{
    q('#accountCard').classList.add('hidden');
    q('#app').classList.remove('hidden');
    q('#passwordMsg').textContent='';
  },700);
 }catch(e){q('#passwordMsg').textContent=e.message||'密码设置失败。'}
 finally{q('#setPasswordBtn').disabled=false}
}

function openAccount(){
 q('#app').classList.add('hidden');
 q('#accountCard').classList.remove('hidden');
}
function closeAccount(){
 q('#accountCard').classList.add('hidden');
 q('#app').classList.remove('hidden');
}

async function login(){
 q('#loginBtn').disabled=true;q('#loginMsg').textContent='正在登录…';
 try{
  const {data,error}=await sb.auth.signInWithPassword({email:q('#email').value.trim(),password:q('#password').value});
  if(error)throw error;
  save(data.session);q('#password').value='';q('#loginMsg').textContent='';showApp(data.session);
 }catch(e){q('#loginMsg').textContent='邮箱或密码未通过验证。'}finally{q('#loginBtn').disabled=false}
}

async function refresh(){
 const {data,error}=await sb.auth.refreshSession();
 if(error||!data.session)throw Error('登录已过期，请重新登录。');
 save(data.session);return data.session;
}
async function session(){
 let s=read();
 if(!s?.access_token){
  const {data}=await sb.auth.getSession();
  s=data.session;
  if(s)save(s);
 }
 if(!s?.access_token)throw Error('请重新登录。');
 if(s.expires_at&&s.expires_at*1000<Date.now()+30000)s=await refresh();
 return s;
}
async function call(action,data={}){
 const s=await session();
 const r=await fetch(DECISION_URL,{method:'POST',headers:{apikey:PUBLIC_KEY,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({action,...data})});
 const x=await r.json();if(r.status===401){save(null);showLogin();throw Error('登录已过期，请重新登录。')}if(!r.ok)throw Error(x.message||x.error||'Jev 请求未完成');return x;
}
function inferOptions(text){
 const parts=text.replace(/[？?。]+$/,'').split(/\s*(?:还是|或者|或是|\bvs\.?\b|\bor\b)\s*/i).map(s=>s.trim()).filter(s=>s.length>=2);
 if(parts.length>=2&&parts.length<=6)return parts.map((label,i)=>({id:'option_'+(i+1),label:label.slice(0,120),description:'用户明确提出的候选方案'}));
 return [
  {id:'act_now',label:'现在行动',description:'先推进一个小而可逆的动作'},
  {id:'gather_info',label:'先补信息',description:'先补最可能改变判断的关键证据'},
  {id:'defer',label:'暂缓决定',description:'保留选择权，等待条件变化'},
  {id:'stop',label:'停止投入',description:'把资源转向更重要的事项'}
 ];
}
function pct(v){return Number.isFinite(v)?Math.round(v*100)+'%':'—'}
function render(d,options){
 const labels=Object.fromEntries(options.map(o=>[o.id,o.label])), probs=d.option_probabilities||{};
 const rows=Object.entries(probs).sort((a,b)=>Number(b[1])-Number(a[1])).map(([id,p])=>'<div class="bar"><span>'+esc(labels[id]||id)+'</span><span class="track"><span class="fill" style="width:'+Math.max(0,Math.min(100,Number(p)*100))+'%"></span></span><span>'+pct(Number(p))+'</span></div>').join('');
 q('#result').innerHTML='<div class="result"><b>Jev 判断：'+esc(d.selected_option?.label||labels[d.selected_option_id]||d.selected_option_id)+'</b><p>选项置信度 '+pct(d.option_confidence)+' · 需要补信息 '+pct(d.need_more_information_probability)+' · 适合先做小测试 '+pct(d.safe_to_test_now_probability)+'</p></div>'+(rows?'<div class="bars">'+rows+'</div>':'');
}
async function routeText(text){
 const s=await session();
 const r=await fetch(ROUTER_URL,{
  method:'POST',
  headers:{apikey:PUBLIC_KEY,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},
  body:JSON.stringify({text})
 });
 const x=await r.json();
 if(r.status===401){save(null);showLogin();throw Error('登录已过期，请重新登录。')}
 if(!r.ok)throw Error(x.error||'DAY1 路由没有完成');
 return x;
}

async function handleOrders(text){
 q('#jevStatus').textContent='DAY1 · 订单与交付';
 const m=text.match(/DAY1-[A-Z0-9-]+/i);
 let query=sb.from('orders')
   .select('order_code,created_at,status,payment_status,process_status,completed_at')
   .order('created_at',{ascending:false})
   .limit(m?1:5);
 if(m)query=query.eq('order_code',m[0].toUpperCase());
 const {data,error}=await query;
 if(error)throw error;
 if(!data?.length){
  q('#result').innerHTML='<div class="result"><b>没有找到对应订单</b><p>可以直接输入订单号，例如 DAY1-xxxx。</p></div>';
  return;
 }
 const rows=data.map(o=>{
   const when=o.created_at?new Date(o.created_at).toLocaleString('zh-CN'):'';
   return '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>'+esc(o.order_code||'未编号')+'</b><p style="margin:5px 0 0;color:var(--muted);font-size:11px">付款 '+esc(o.payment_status||'—')+' · 流程 '+esc(o.process_status||'—')+' · '+esc(when)+'</p></div>';
 }).join('');
 q('#result').innerHTML='<div class="result"><b>'+(m?'订单结果':'最近订单')+'</b><p>来自 DAY1 云端订单库。</p></div><div>'+rows+'</div>';
}

function renderRoutedModule(route){
 q('#jevStatus').textContent='DAY1 · '+esc(route.label);
 const plan=route.task?.plan||{};
 const copy={
  design:'设计任务已经进入 DAY1 任务队列，并生成了专业 brief。',
  content:'内容任务已经进入 DAY1 任务队列，并生成了创作 brief。',
  finance:'财务模块已识别并记录任务。独立工作台的财务数据连接器还未接入。',
  files:'文件模块已识别并记录任务。下一步接入 DAY1 知识库检索。',
  agent:'Agent / 自动化模块已识别并记录任务。下一步接执行器与状态回传。',
  general:'通用任务已记录。下一步接通用执行器。'
 }[route.route]||'任务已进入 DAY1。';

 let detail='';
 if(route.route==='content'){
   detail='<p><b>类型：</b>'+esc(plan.format||'内容')+'<br><b>结构：</b>'+esc((plan.structure||[]).join(' → '))+'<br><b>风格：</b>'+esc((plan.voice||[]).join(' / '))+'</p>';
 }
 if(route.route==='design'){
   detail='<p><b>任务：</b>'+esc(plan.deliverable||'庭院设计判断')+'<br><b>原则：</b>'+esc((plan.principles||[]).join(' / '))+(plan.concerns?.length?'<br><b>重点：</b>'+esc(plan.concerns.join(' / ')):'')+'</p>';
 }
 const taskId=route.task?.id?'<p>任务 ID：'+esc(route.task.id.slice(0,8))+'</p>':'';
 q('#result').innerHTML='<div class="result"><b>已路由：'+esc(route.label)+'</b><p>'+esc(copy)+'</p>'+detail+taskId+'</div>';
}

async function ask(){
 const text=q('#prompt').value.trim();if(text.length<3)return;
 q('#askBtn').disabled=true;q('#askBtn').textContent='DAY1 正在判断…';q('#result').innerHTML='';
 try{
  const route=await routeText(text);
  if(route.route==='orders'){
    await handleOrders(text);
  }else if(route.route==='decision'){
    q('#jevStatus').textContent='DAY1 · Jev 决策';
    q('#askBtn').textContent='Jev 判断中…';
    const options=inferOptions(text);
    const x=await call('evaluate',{decision:{objective:text,context:text,options,constraints:[],evidence:[],unknowns:[]}});
    render(x.decision,options);
  }else{
    renderRoutedModule(route);
  }
 }catch(e){q('#result').innerHTML='<div class="result"><b>暂时没有返回结果</b><p>'+esc(e.message)+'</p></div>'}
 finally{q('#askBtn').disabled=false;q('#askBtn').textContent='交给 DAY1'}
}
async function checkStatus(){try{const x=await call('status');q('#jevStatus').textContent=x.configured?'Jev · 在线':'Jev · 待配置'}catch{q('#jevStatus').textContent='Jev · 未连接'}}
const sb=window.supabase.createClient(SUPABASE_URL,PUBLIC_KEY,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});

q('#googleLoginBtn').onclick=googleLogin;
q('#loginBtn').onclick=login;
q('#accountBtn').onclick=openAccount;
q('#setPasswordBtn').onclick=setNewPassword;
q('#closeAccountBtn').onclick=closeAccount;
q('#togglePassword').onclick=()=>q('#passwordBox').classList.toggle('hidden');
q('#askBtn').onclick=ask;
q('#logout').onclick=async()=>{await sb.auth.signOut();save(null);showLogin()};
q('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

(async()=>{
 const {data,error}=await sb.auth.getSession();
 if(error){q('#loginMsg').textContent=error.message}
 const s=data?.session||read();
 if(s?.access_token){save(s);showApp(s)}else{showLogin()}
})();
</script></div></body></html>
