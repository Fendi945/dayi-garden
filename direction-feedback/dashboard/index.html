<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>收银与反馈｜大一造园</title><style>
:root{
  --bg:#f8f6f3;--paper:#fffdf9;--ink:#222;--muted:#7c756f;
  --line:#ded8d1;--red:#c6402f;--soft:#eee9e3;--ok:#222222;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh}
button,input{font:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 60px}
.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(34,34,34,.08)}
.brand{display:flex;align-items:center;gap:12px}
.wordmark{font-family:Georgia,"Times New Roman",serif;font-size:27px;letter-spacing:.01em}
.wordmark .i{position:relative;display:inline-block}
.wordmark .i:before{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--red);left:50%;transform:translateX(-50%);top:-7px}
.brand-cn{font-size:12px;letter-spacing:.15em}
.top-actions{display:flex;align-items:center;gap:10px}
.linkbtn{border:0;background:none;color:var(--muted);padding:8px;font-size:13px;cursor:pointer}
.hero{padding:38px 0 24px}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--red);font-weight:700;margin-bottom:10px}
h1{font-family:Georgia,"Noto Serif SC","Songti SC",serif;font-size:clamp(34px,6vw,54px);font-weight:500;margin:0;line-height:1.15}
.hero p{color:var(--muted);margin:12px 0 0;font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px}
.login{max-width:480px;margin:50px auto}
.login h2{font-family:Georgia,"Noto Serif SC",serif;font-weight:500;margin:0 0 8px}
.field{margin:16px 0}
label{display:block;font-size:13px;margin-bottom:7px}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);outline:none}
input:focus{border-color:#999}
.btn{border:0;border-radius:999px;background:var(--red);color:#fff;padding:13px 20px;cursor:pointer}
.btn:disabled{opacity:.5}
.error{color:#a33;font-size:13px;margin-top:12px;line-height:1.6}
.hidden{display:none!important}
.range{display:flex;gap:8px;margin:14px 0 22px;flex-wrap:wrap}
.range button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer}
.range button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.metric{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}
.metric span{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
.metric strong{font:32px Georgia,serif}
.metric small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.section{margin-top:30px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
.section h2{font-family:Georgia,"Noto Serif SC",serif;font-weight:500;font-size:24px;margin:0}
.section-head span{font-size:12px;color:var(--muted)}
.funnel{display:grid;gap:10px}
.funnel-row{display:grid;grid-template-columns:120px 1fr 62px;gap:10px;align-items:center}
.funnel-name{font-size:13px}
.bar{height:11px;background:#ebe6e0;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:999px;min-width:2px}
.funnel-value{text-align:right;font:17px Georgia,serif}
.source-list{display:grid;gap:9px}
.source{display:grid;grid-template-columns:minmax(120px,1.3fr) repeat(3,minmax(62px,.7fr));gap:8px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}
.source.header{color:var(--muted);font-size:11px}
.source div:not(:first-child){text-align:right}
.orders{display:grid;gap:10px}
.order{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:15px}
.order-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.order-code{font:16px Georgia,serif}
.amount{font:18px Georgia,serif}
.order-meta{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:9px;font-size:12px;color:var(--muted)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--ink);background:#faf8f5}
.order details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.order summary{cursor:pointer;font-size:13px;color:var(--ink);list-style:none;display:flex;align-items:center;justify-content:space-between;padding:5px 0}
.order summary::-webkit-details-marker{display:none}
.order summary:after{content:"＋";font-size:16px;color:var(--muted)}
.order details[open] summary:after{content:"－"}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.detail-block{border:1px solid var(--line);border-radius:14px;background:#fcfaf7;padding:14px;min-width:0}
.detail-block.full{grid-column:1/-1}
.detail-title{font-size:11px;letter-spacing:.08em;color:var(--muted);margin-bottom:9px}
.detail-text{font-size:13px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.detail-img{display:block;width:100%;max-height:420px;object-fit:contain;background:#f2eee9;border:1px solid var(--line);border-radius:12px}
.img-placeholder{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12px;background:#f2eee9;border-radius:12px;padding:16px}
.prompt-box{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word;background:#f5f1eb;border-radius:10px;padding:12px;max-height:360px;overflow:auto}
.need-tags{display:flex;flex-wrap:wrap;gap:7px}
.need-tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:var(--paper)}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.order-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.action-primary{border:0;border-radius:999px;background:var(--red);color:#fff;padding:11px 16px;cursor:pointer}
.action-primary:disabled{opacity:.5;cursor:not-allowed}
.action-secondary{border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);padding:11px 16px;cursor:pointer}
.action-note{font-size:12px;line-height:1.7;color:var(--muted);margin-top:8px}
@media(max-width:720px){
  .detail-grid,.result-grid{grid-template-columns:1fr}
  .detail-block.full{grid-column:auto}
}
.refresh{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:18px 0}
.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:#999}
@media(max-width:720px){
  .metrics{grid-template-columns:1fr 1fr}
  .funnel-row{grid-template-columns:95px 1fr 50px}
  .source{grid-template-columns:1.25fr repeat(3,.65fr);font-size:12px}
  .source .hide-mobile{display:none}
}

.brand-master{width:216px;height:auto;mix-blend-mode:multiply}.settings{margin:24px 0}.settings summary{cursor:pointer;font-size:18px}.settings label{margin:16px 0 6px}.settings input,.settings select,.settings textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}.settings input[type=checkbox]{width:auto}.settings .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.settings p,.sub{font-size:13px;line-height:1.8;color:var(--muted)}.settings textarea{min-height:80px}.feedback{position:sticky;top:8px;padding:12px 16px;background:var(--paper);border:1px solid var(--red);z-index:3;font-size:14px;line-height:1.7}.feedback:empty{display:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:3px}button{touch-action:manipulation}select{font:inherit;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px}.order-code{overflow-wrap:anywhere}.order-top{align-items:flex-start}.order{background:var(--paper)}.order ul{font-size:14px;line-height:1.9;padding-left:22px}.quality{border-left:2px solid var(--ink);padding:8px 12px;font-size:13px;line-height:1.8;margin:12px 0}.test-types{font-size:13px;line-height:1.8}button:disabled{cursor:wait;opacity:.55}@media(max-width:580px){.brand-master{width:170px}.settings .row{grid-template-columns:1fr}.top-actions{gap:0}.topbar{height:66px}.hero{padding-top:28px}.card{padding:18px}.order-top{flex-wrap:wrap}}
dialog{width:min(780px,94vw);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:20px;padding:24px;background:var(--paper)}dialog::backdrop{background:#2227}textarea{width:100%;min-height:90px;padding:12px;font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--paper);resize:vertical}#deliveryMessage{color:#a33;line-height:1.7}#deliveryPreview{max-height:260px}.dialog-top{display:flex;justify-content:space-between;align-items:center}button:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:3px}</style></head><body><div class="wrap">
<header class="topbar"><img class="brand-master" src="../assets/dayi-master-v1.6.png" alt="dayi 大一造园"><div class="top-actions"><a class="linkbtn" href="../">客户页面</a><button class="linkbtn hidden" id="logout">退出</button></div></header>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
<section id="login" class="card login"><h2>收银与反馈</h2><p class="sub">查看客户需求、核对到账、交付方向反馈。</p><form id="loginForm"><div class="field"><label for="email">邮箱</label><input id="email" type="email" value="day1garden58@gmail.com" autocomplete="username" required></div><div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="loginButton">登录业务后台</button></form></section>
<main id="workspace" class="hidden"><div class="hero"><div class="eyebrow">DAYI / FEEDBACK</div><h1>收款清楚，反馈有序。</h1><p id="serviceStatus">正在读取交付状态…</p></div>
<div class="range" id="ranges"><button data-days="1">近24小时</button><button data-days="7" class="active">近7天</button><button data-days="30">近30天</button><button data-days="3650">全部</button></div>
<div class="metrics"><div class="metric"><span>待核对到账</span><strong id="pending">—</strong><small>以实际到账为准</small></div><div class="metric"><span>已提交订单</span><strong id="submitted">—</strong><small>排除后台测试</small></div><div class="metric"><span>完整交付</span><strong id="completed">—</strong><small>图片与3条建议齐全</small></div><div class="metric"><span>确认到账</span><strong id="revenue">—</strong><small id="paidCount">仅统计已确认款项</small></div></div>
<p class="sub" id="funnel"></p><section class="section"><div class="section-head"><h2>订单与交付</h2><button class="linkbtn" id="refresh">刷新</button></div><div class="range" id="filters"><button data-filter="pending" class="active">待确认到账</button><button data-filter="processing">待交付</button><button data-filter="completed">已交付</button><button data-filter="failed">需要跟进</button><button data-filter="all">客户订单</button></div><p class="sub">核对银行或收款平台的实际到账记录后，再点击确认。付款截图用于匹配订单，不能代替到账记录。</p><div id="orders" class="orders"></div><button class="linkbtn hidden" id="more">加载更多</button></section>
<p class="foot">大一造园 · 庭院改造方向反馈｜订单、到账与反馈记录持续保存。</p></main></div>
<dialog id="deliveryDialog"><div class="dialog-top"><h2>核对并交付反馈</h2><button id="closeDelivery" class="linkbtn" type="button">关闭</button></div><p class="sub" id="deliveryOrder"></p><p class="sub">对照原院核对方向图与建议，提交后客户可在原订单页查看。</p><div class="detail-grid"><img class="detail-img" id="deliveryOriginal" alt="客户原院照片"><img class="detail-img" id="deliveryPreview" alt="待交付方向图" hidden></div><form id="deliveryForm"><div class="field"><label for="deliveryImage">方向图（JPG、PNG 或 WebP，6MB以内）</label><input id="deliveryImage" type="file" accept="image/jpeg,image/png,image/webp" required></div><label for="advice1">设计建议 1</label><textarea id="advice1" minlength="3" maxlength="1200" required></textarea><label for="advice2">设计建议 2</label><textarea id="advice2" minlength="3" maxlength="1200" required></textarea><label for="advice3">设计建议 3</label><textarea id="advice3" minlength="3" maxlength="1200" required></textarea><p id="deliveryMessage" role="status"></p><button class="btn" id="publishDelivery">已核对，交付给客户</button></form></dialog><script type="module" src="./admin.mjs?v=20260920-cashier"></script></body></html>
