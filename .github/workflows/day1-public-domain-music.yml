name: DAY1 CC0 Guzheng Cuts

on:
  push:
    branches:
      - tools/day1-music-public-domain
  workflow_dispatch:

jobs:
  cut-music:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download CC0 guzheng solo
        run: |
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/Oozaruu/TongGameUpdateServiceBinaries/main/win-x64/Assets/Audio/quadro_2_8bit.mp3" \
            -o source.mp3

      - name: Inspect
        run: ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 source.mp3

      - name: Create three DAY1 guzheng cuts
        run: |
          mkdir -p out
          ffmpeg -y -ss 4  -t 16.5 -i source.mp3 -af "highpass=f=55,lowpass=f=5200,afade=t=in:st=0:d=2.0,afade=t=out:st=15.2:d=1.3,loudnorm=I=-24:TP=-6:LRA=5" -ar 48000 -ac 2 -b:a 192k out/A_guzheng_4s.mp3
          ffmpeg -y -ss 28 -t 16.5 -i source.mp3 -af "highpass=f=55,lowpass=f=5200,afade=t=in:st=0:d=2.0,afade=t=out:st=15.2:d=1.3,loudnorm=I=-24:TP=-6:LRA=5" -ar 48000 -ac 2 -b:a 192k out/B_guzheng_28s.mp3
          ffmpeg -y -ss 52 -t 16.5 -i source.mp3 -af "highpass=f=55,lowpass=f=5200,afade=t=in:st=0:d=2.0,afade=t=out:st=15.2:d=1.3,loudnorm=I=-24:TP=-6:LRA=5" -ar 48000 -ac 2 -b:a 192k out/C_guzheng_52s.mp3

      - name: Write licence note
        run: |
          cat > out/LICENSE.txt <<'EOF'
          Source title: "guzheng solo"
          Creator: neolein
          Original source: https://freesound.org/people/neolein/sounds/472707/
          Licence: Creative Commons Zero (CC0 1.0)
          Source confirmation: Freesound page states CC0 and permits commercial reuse without permission.
          Repository copy used for processing:
          https://github.com/Oozaruu/TongGameUpdateServiceBinaries/blob/main/win-x64/Assets/Audio/quadro_2_8bit.mp3
          Processing: excerpting, darker EQ, fade in/out, loudness normalization.
          EOF

      - name: Upload cuts
        uses: actions/upload-artifact@v4
        with:
          name: day1-cc0-guzheng-cuts
          path: out/
          retention-days: 3
